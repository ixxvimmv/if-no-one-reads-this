/* ===================================================================
   SMALL HELPERS
=================================================================== */
function escapeHtml(str){ return String(str||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return "—"; return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTimeInput(iso){
  if(!iso) return "";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(() => el.classList.remove('show'), 2600);
}
/* Fire-and-forget push after any content change, if GitHub sync is configured
   and a token has been entered on this device. Never blocks the UI — the local
   save has already succeeded either way; this just also shares it. */
function maybeSyncPush(){
  if (!CMS.isSyncTargetConfigured()) return;
  const cfg = CMS.getSyncConfig();
  if (!cfg.token) return;
  CMS.pushToGitHub().then(res => {
    if (res.ok) toast('Saved, and synced to GitHub for other devices.');
    else toast('Saved locally, but GitHub sync failed: ' + res.reason);
  });
}
function computeStatus(post){
  if (post.status === 'archived') return 'archived';
  if (post.status === 'draft') return 'draft';
  if (post.status === 'published' && new Date(post.publishDate) > new Date()) return 'scheduled';
  return post.status; // published
}
function statusBadge(post){
  const s = computeStatus(post);
  const label = s === 'scheduled' ? 'Scheduled' : s === 'draft' ? 'Draft' : s === 'archived' ? 'Archived' : 'Published';
  return `<span class="badge badge-${s}">${label}</span>`;
}

/* ===================================================================
   MODAL / CONFIRM
=================================================================== */
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay open" id="modal-overlay"><div class="modal-box">${html}</div></div>`;
  document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
function confirmAction(message, onConfirm, opts){
  const label = (opts && opts.confirmLabel) || 'Delete';
  const danger = !(opts && opts.soft);
  openModal(`
    <h3>Are you sure?</h3>
    <p style="font-family:var(--sans);font-size:14px;color:var(--text-muted);">${message}</p>
    <div class="modal-actions">
      <button class="btn ghost" id="confirm-cancel">Cancel</button>
      <button class="btn ${danger ? 'danger' : ''}" id="confirm-ok">${label}</button>
    </div>
  `);
  document.getElementById('confirm-cancel').addEventListener('click', closeModal);
  document.getElementById('confirm-ok').addEventListener('click', () => { onConfirm(); closeModal(); });
}

/* ===================================================================
   ROUTER
=================================================================== */
const routes = {};
function route(pattern, handler){ routes[pattern] = handler; }
function matchRoute(path){
  for (const pattern in routes){
    const parts = pattern.split('/').filter(Boolean);
    const pathParts = path.split('/').filter(Boolean);
    if (parts.length !== pathParts.length) continue;
    const params = {};
    let ok = true;
    for (let i=0;i<parts.length;i++){
      if (parts[i].startsWith(':')) params[parts[i].slice(1)] = decodeURIComponent(pathParts[i]);
      else if (parts[i] !== pathParts[i]) { ok = false; break; }
    }
    if (ok) return { handler: routes[pattern], params };
  }
  return null;
}
const PUBLIC_ROUTES = ['/login'];

function render(){
  const hash = location.hash.replace(/^#/, '') || '/dashboard';
  const app = document.getElementById('app');

  if (!CMS.isAuthed() && !PUBLIC_ROUTES.includes(hash)){
    location.hash = '/login';
    return;
  }
  if (CMS.isAuthed() && hash === '/login'){
    location.hash = '/dashboard';
    return;
  }

  if (hash === '/login'){
    app.innerHTML = viewLogin();
    wireLogin();
    return;
  }

  const match = matchRoute(hash);
  const body = match ? match.handler(match.params) : `<div class="admin-empty">Page not found. <a href="#/dashboard">Back to dashboard</a></div>`;
  app.innerHTML = adminShell(body, hash);
  wireShell();
  const routeKey = '/' + hash.split('/').filter(Boolean).slice(0,2).join('/');
  if (wireMap[routeKey]) wireMap[routeKey](match ? match.params : {});
}

/* ===================================================================
   LOGIN VIEW
=================================================================== */
function viewLogin(){
  return `
  <div class="login-screen">
    <div class="login-card">
      <div class="brand-mark">If No One Reads This</div>
      <p class="lede-sm">Admin dashboard — sign in to manage your writing.</p>
      <div class="login-error" id="login-error">Incorrect username or password. Try again.</div>
      <div class="field-group">
        <label class="field-label" for="login-user">Username</label>
        <input class="field-input" type="text" id="login-user" placeholder="Enter admin username" autocomplete="username" autofocus>
      </div>
      <div class="field-group">
        <label class="field-label" for="login-pass">Password</label>
        <input class="field-input" type="password" id="login-pass" placeholder="Enter admin password" autocomplete="current-password">
      </div>
      <button class="btn" style="width:100%;justify-content:center;" id="login-btn">Sign in</button>
    </div>
  </div>`;
}
function wireLogin(){
  const btn = document.getElementById('login-btn');
  const userInput = document.getElementById('login-user');
  const passInput = document.getElementById('login-pass');
  function tryLogin(){
    if (CMS.login(userInput.value.trim(), passInput.value)){
      CMS.markKnownDevice();
      location.hash = '/dashboard';
    } else {
      document.getElementById('login-error').classList.add('show');
    }
  }
  btn.addEventListener('click', tryLogin);
  [userInput, passInput].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); }));
}

/* ===================================================================
   DASHBOARD VIEW
=================================================================== */
function viewDashboard(){
  const posts = CMS.getAllPosts();
  const published = posts.filter(p => computeStatus(p) === 'published');
  const drafts = posts.filter(p => computeStatus(p) === 'draft');
  const scheduled = posts.filter(p => computeStatus(p) === 'scheduled');
  const cats = CMS.getCategories();
  const tags = CMS.getTags();
  const recent = [...posts].sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0,6);

  return `
  <div class="admin-topbar"><h1>Dashboard</h1><a class="btn" href="#/writings/new">+ New writing</a></div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-num">${posts.length}</div><div class="stat-label">Total writings</div></div>
    <div class="stat-card"><div class="stat-num">${published.length}</div><div class="stat-label">Published</div></div>
    <div class="stat-card"><div class="stat-num">${drafts.length}</div><div class="stat-label">Drafts</div></div>
    <div class="stat-card"><div class="stat-num">${scheduled.length}</div><div class="stat-label">Scheduled</div></div>
    <div class="stat-card"><div class="stat-num">${CMS.getTotalViews().toLocaleString()}</div><div class="stat-label">Total views</div></div>
  </div>
  <div class="admin-panel">
    <h3>Recent activity</h3>
    ${recent.length ? recent.map(p => `
      <div class="activity-row">
        <span><a href="#/writings/edit/${p.id}" style="text-decoration:none;color:inherit;">${p.title}</a> ${statusBadge(p)}</span>
        <span>updated ${fmtDate(p.updatedAt)}</span>
      </div>`).join('') : `<div class="admin-empty">No activity yet.</div>`}
  </div>
  <div class="admin-panel">
    <h3>At a glance</h3>
    <div class="activity-row"><span>Tags in use</span><span>${tags.length}</span></div>
    <div class="activity-row"><span>Featured writings</span><span>${posts.filter(p=>p.featured).length}</span></div>
    <div class="activity-row"><span>Media items uploaded</span><span>${CMS.getMedia().length}</span></div>
  </div>
  `;
}

/* ===================================================================
   WRITINGS LIST VIEW
=================================================================== */
let adminWritingsFilter = 'all';
function viewWritingsList(){
  const all = [...CMS.getAllPosts()].sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  const counts = {
    all: all.length,
    published: all.filter(p => computeStatus(p) === 'published').length,
    draft: all.filter(p => computeStatus(p) === 'draft').length,
    scheduled: all.filter(p => computeStatus(p) === 'scheduled').length,
    archived: all.filter(p => computeStatus(p) === 'archived').length,
  };
  const posts = adminWritingsFilter === 'all' ? all : all.filter(p => computeStatus(p) === adminWritingsFilter);
  const filters = [
    ['all','All'], ['published','Published'], ['draft','Drafts'], ['scheduled','Scheduled'], ['archived','Archived'],
  ];
  return `
  <div class="admin-topbar"><h1>Writings</h1><a class="btn" href="#/writings/new">+ New writing</a></div>
  <div class="chip-row" id="writings-status-filters" style="margin-bottom:22px;">
    ${filters.map(([key,label]) => `<button class="chip ${adminWritingsFilter===key?'active':''}" data-status-filter="${key}">${label} (${counts[key]})</button>`).join('')}
  </div>
  <div class="admin-panel" style="padding:0;">
    <div class="table-wrap">
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Published</th><th>Updated</th><th>Views</th><th></th></tr></thead>
      <tbody id="writings-tbody">
        ${posts.length ? posts.map(p => `
        <tr data-id="${p.id}">
          <td class="title-cell">${p.title}${p.featured ? ' ★' : ''}<span class="sub">/${p.slug}</span></td>
          <td>${(CMS.getCategory(p.category)||{}).name || '—'}</td>
          <td>${statusBadge(p)}</td>
          <td>${fmtDate(p.publishDate)}</td>
          <td>${fmtDate(p.updatedAt)}</td>
          <td>${CMS.getViewsForPost(p.slug).toLocaleString()}</td>
          <td>
            <div class="row-actions">
              <a class="btn-icon" href="#/writings/edit/${p.id}" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></a>
              <button class="btn-icon" data-dup="${p.id}" title="Duplicate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              ${computeStatus(p) === 'archived'
                ? `<button class="btn-icon" data-restore="${p.id}" title="Restore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg></button>`
                : `<button class="btn-icon" data-archive="${p.id}" title="Archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><line x1="10" y1="13" x2="14" y2="13"/></svg></button>`}
              <button class="btn-icon" data-del="${p.id}" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
            </div>
          </td>
        </tr>`).join('') : `<tr><td colspan="7"><div class="admin-empty">${adminWritingsFilter==='all' ? `No writings yet. <a href="#/writings/new">Create your first one</a>.` : `No writings with this status.`}</div></td></tr>`}
      </tbody>
    </table>
    </div>
  </div>
  `;
}
function wireWritingsList(){
  const tbody = document.getElementById('writings-tbody');
  if (!tbody) return;
  document.getElementById('writings-status-filters').addEventListener('click', e => {
    const chip = e.target.closest('[data-status-filter]');
    if (chip){ adminWritingsFilter = chip.dataset.statusFilter; render(); }
  });
  tbody.addEventListener('click', e => {
    const dup = e.target.closest('[data-dup]');
    const del = e.target.closest('[data-del]');
    const archive = e.target.closest('[data-archive]');
    const restore = e.target.closest('[data-restore]');
    if (dup){ CMS.duplicatePost(dup.dataset.dup); toast('Writing duplicated as a draft.'); render(); maybeSyncPush(); }
    if (archive){ CMS.archivePost(archive.dataset.archive); toast('Writing archived.'); render(); maybeSyncPush(); }
    if (restore){ CMS.restorePost(restore.dataset.restore); toast('Writing restored.'); render(); maybeSyncPush(); }
    if (del){
      confirmAction('This will permanently delete this writing.', () => {
        CMS.deletePost(del.dataset.del);
        toast('Writing deleted.');
        render();
        maybeSyncPush();
      });
    }
  });
}

  ${notFeatured.length ? `

      <tbody id="unfeatured-tbody">
        ${notFeatured.map(p => `
        <tr data-id="${p.id}">
          <td class="title-cell">${p.title}<span class="sub">/${p.slug}</span></td>
          <td>${(CMS.getCategory(p.category)||{}).name || '—'}</td>
          <td><div class="row-actions">
            <button class="btn-icon" data-feature="${p.id}" title="Add to featured"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
          </div></td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
  </div>` : ''}
  `;
}
function wireFeaturedAdmin(){
  const tbody = document.getElementById('featured-tbody');
  if (!tbody) return;

  function moveFeatured(id, direction){
    const ordered = CMS.getFeaturedPostsOrdered().map(p => p.id);
    const idx = ordered.indexOf(id);
    const swapWith = idx + direction;
    if (swapWith < 0 || swapWith >= ordered.length) return;
    [ordered[idx], ordered[swapWith]] = [ordered[swapWith], ordered[idx]];
    CMS.reorderFeatured(ordered);
    toast('Order updated.');
    render();
    maybeSyncPush();
  }

  tbody.addEventListener('click', e => {
    const up = e.target.closest('[data-move-up]');
    const down = e.target.closest('[data-move-down]');
    const unfeature = e.target.closest('[data-unfeature]');
    if (up) moveFeatured(up.dataset.moveUp, -1);
    if (down) moveFeatured(down.dataset.moveDown, 1);
    if (unfeature){
      const post = CMS.getPostById(unfeature.dataset.unfeature);
      if (post){
        CMS.savePost(Object.assign({}, post, { featured: false }));
        toast('Removed from featured.');
        render();
        maybeSyncPush();
      }
    }
  });

  /* ---- drag-and-drop reordering ---- */
  let draggedRow = null;
  tbody.querySelectorAll('tr[draggable="true"]').forEach(row => {
    row.addEventListener('dragstart', e => {
      draggedRow = row;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', row.dataset.id); } catch (err) {}
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      draggedRow = null;
      const newOrder = Array.from(tbody.querySelectorAll('tr[data-id]')).map(r => r.dataset.id);
      CMS.reorderFeatured(newOrder);
      toast('Order updated.');
      render();
      maybeSyncPush();
    });
  });
  tbody.addEventListener('dragover', e => {
    e.preventDefault();
    if (!draggedRow) return;
    const target = e.target.closest('tr[data-id]');
    if (!target || target === draggedRow) return;
    const rect = target.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    tbody.insertBefore(draggedRow, before ? target : target.nextSibling);
  });

  const unfeaturedTbody = document.getElementById('unfeatured-tbody');
  if (unfeaturedTbody){
    unfeaturedTbody.addEventListener('click', e => {
      const feature = e.target.closest('[data-feature]');
      if (feature){
        const post = CMS.getPostById(feature.dataset.feature);
        if (post){
          CMS.savePost(Object.assign({}, post, { featured: true, featuredOrder: undefined }));
          toast('Added to featured.');
          render();
          maybeSyncPush();
        }
      }
    });
  }
}

function wireEditor(surfaceId, toolbarEl){
  const surface = document.getElementById(surfaceId);
  document.execCommand('styleWithCSS', false, true);

  toolbarEl.querySelectorAll('button[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => e.preventDefault()); // keep focus/selection in editor
    btn.addEventListener('click', () => {
      surface.focus();
      const cmd = btn.dataset.cmd;
      if (cmd === 'createLink'){
        const url = prompt('Link URL:', 'https://');
        if (url) document.execCommand('createLink', false, url);
        return;
      }
      if (cmd === 'insertImage'){
        openImagePicker(dataUrl => {
          surface.focus();
          document.execCommand('insertImage', false, dataUrl);
        });
        return;
      }
      if (cmd === 'formatBlock' && btn.dataset.arg === 'BLOCKQUOTE'){
        const sel = window.getSelection();
        let node = sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
        let inQuote = false;
        while (node && node !== surface){
          if (node.nodeType === 1 && node.tagName === 'BLOCKQUOTE'){ inQuote = true; break; }
          node = node.parentNode;
        }
        document.execCommand('formatBlock', false, inQuote ? 'P' : 'BLOCKQUOTE');
        return;
      }
      document.execCommand(cmd, false, btn.dataset.arg || undefined);
    });
  });

  const blockSelect = toolbarEl.querySelector('select[id^="ed-block-format"]');
  if (blockSelect){
    blockSelect.addEventListener('mousedown', () => surface.focus());
    blockSelect.addEventListener('change', () => {
      surface.focus();
      document.execCommand('formatBlock', false, blockSelect.value);
      blockSelect.blur();
    });
  }

  const fontSelect = toolbarEl.querySelector('select[id^="ed-font"]');
  if (fontSelect){
    fontSelect.addEventListener('mousedown', () => surface.focus());
    fontSelect.addEventListener('change', () => {
      surface.focus();
      if (fontSelect.value) document.execCommand('fontName', false, fontSelect.value);
      fontSelect.blur();
    });
  }

  const textColor = toolbarEl.querySelector('.ed-text-color');
  if (textColor){
    textColor.addEventListener('mousedown', e => e.stopPropagation());
    textColor.addEventListener('input', () => {
      surface.focus();
      document.execCommand('foreColor', false, textColor.value);
    });
  }
  const highlightColor = toolbarEl.querySelector('.ed-highlight-color');
  if (highlightColor){
    highlightColor.addEventListener('mousedown', e => e.stopPropagation());
    highlightColor.addEventListener('input', () => {
      surface.focus();
      document.execCommand('hiliteColor', false, highlightColor.value);
    });
  }
  const clearColorBtn = toolbarEl.querySelector('.ed-clear-color');
  if (clearColorBtn){
    clearColorBtn.addEventListener('mousedown', e => e.preventDefault());
    clearColorBtn.addEventListener('click', () => {
      surface.focus();
      document.execCommand('removeFormat', false, undefined);
    });
  }
}

/* ===================================================================
   IMAGE PICKER MODAL (used by editor + cover image field)
=================================================================== */
function openImagePicker(onSelect){
  const media = CMS.getMedia();
  openModal(`
    <h3>Select or upload an image</h3>
    <div class="media-dropzone" id="picker-dropzone">Click to upload a new image, or choose one below</div>
    <input type="file" id="picker-file" accept="image/*" style="display:none;">
    <div class="media-grid" id="picker-grid">
      ${media.map(m => `<div class="media-item" data-select="${m.id}"><img src="${m.dataUrl}" alt=""><div class="media-name">${escapeHtml(m.name)}</div></div>`).join('') || `<div class="admin-empty">No images uploaded yet.</div>`}
    </div>
    <div class="modal-actions"><button class="btn ghost" id="picker-cancel">Cancel</button></div>
  `);
  document.getElementById('picker-cancel').addEventListener('click', closeModal);
  document.getElementById('picker-dropzone').addEventListener('click', () => document.getElementById('picker-file').click());
  document.getElementById('picker-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const saved = CMS.saveMedia({ name: file.name, dataUrl: reader.result });
      onSelect(saved.dataUrl);
      closeModal();
      toast('Image uploaded.');
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('picker-grid').addEventListener('click', e => {
    const item = e.target.closest('[data-select]');
    if (item){
      const m = media.find(x => x.id === item.dataset.select);
      if (m){ onSelect(m.dataUrl); closeModal(); }
    }
  });
}

function wireWritingEditor(params){
  const contentSurface = document.getElementById('f-content');
  if (!contentSurface) return;
  wireEditor('f-content', document.querySelector('.editor-toolbar[data-for="f-content"]'));
  wireEditor('f-footer', document.querySelector('.editor-toolbar[data-for="f-footer"]'));

  const archiveBtn = document.getElementById('archive-btn');
  if (archiveBtn){
    archiveBtn.addEventListener('click', () => {
      confirmAction('Archive this writing? It will be hidden from the public site but not deleted — you can restore it any time.', () => {
        CMS.archivePost(params.id);
        toast('Writing archived.');
        location.hash = '/writings/edit/' + params.id;
        render();
        maybeSyncPush();
      }, { confirmLabel: 'Archive', soft: true });
    });
  }
  const restoreBtn = document.getElementById('restore-btn');
  if (restoreBtn){
    restoreBtn.addEventListener('click', () => {
      CMS.restorePost(params.id);
      toast('Writing restored.');
      location.hash = '/writings/edit/' + params.id;
      render();
      maybeSyncPush();
    });
  }

  document.querySelectorAll('#tag-picker .tag-pick').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('selected'));
  });

  const cardColorInput = document.getElementById('f-card-color');
  const cardColorEnabled = document.getElementById('f-card-color-enabled');
  const clearCardColorBtn = document.getElementById('clear-card-color-btn');
  function setCardColor(hex){
    cardColorInput.value = hex;
    cardColorEnabled.value = '1';
    clearCardColorBtn.style.display = '';
  }
  if (cardColorInput){
    cardColorInput.addEventListener('input', () => setCardColor(cardColorInput.value));
  }
  document.querySelectorAll('.color-preset').forEach(btn => {
    btn.addEventListener('click', () => setCardColor(btn.dataset.preset));
  });
  if (clearCardColorBtn){
    clearCardColorBtn.addEventListener('click', () => {
      cardColorEnabled.value = '0';
      clearCardColorBtn.style.display = 'none';
    });
  }

  document.getElementById('choose-cover-btn').addEventListener('click', () => {
    openImagePicker(dataUrl => {
      document.getElementById('f-cover').value = dataUrl;
      const wrap = document.querySelector('.cover-picker');
      const existing = document.getElementById('cover-preview') || document.getElementById('cover-preview-empty');
      const img = document.createElement('img');
      img.className = 'cover-preview'; img.id = 'cover-preview'; img.src = dataUrl;
      existing.replaceWith(img);
      const removeBtn = document.getElementById('remove-cover-btn');
      if (removeBtn) removeBtn.style.display = '';
    });
  });

  const removeCoverBtn = document.getElementById('remove-cover-btn');
  if (removeCoverBtn){
    removeCoverBtn.addEventListener('click', () => {
      confirmAction(
        'Remove the cover image from this writing? This will take effect once you save or publish.',
        () => {
          document.getElementById('f-cover').value = '';
          const existing = document.getElementById('cover-preview') || document.getElementById('cover-preview-empty');
          const placeholder = document.createElement('div');
          placeholder.className = 'cover-preview-empty'; placeholder.id = 'cover-preview-empty'; placeholder.textContent = 'No cover image';
          existing.replaceWith(placeholder);
          removeCoverBtn.style.display = 'none';
          toast('Cover image removed — save or publish to apply.');
        },
        { confirmLabel: 'Remove image', soft: true }
      );
    });
  }

  const fontSizeInput = document.getElementById('f-font-size');
  const fontSizeValue = document.getElementById('font-size-value');
  const contentSurfaceEl = document.getElementById('f-content');
  const MIN_FONT = 14, MAX_FONT = 30;
  function applyFontSize(px){
    px = Math.min(MAX_FONT, Math.max(MIN_FONT, px));
    fontSizeInput.value = px;
    fontSizeValue.textContent = px + 'px';
    contentSurfaceEl.style.fontSize = px + 'px';
  }
  const decBtn = document.getElementById('font-size-dec');
  const incBtn = document.getElementById('font-size-inc');
  if (decBtn) decBtn.addEventListener('click', () => applyFontSize(parseInt(fontSizeInput.value,10) - 1));
  if (incBtn) incBtn.addEventListener('click', () => applyFontSize(parseInt(fontSizeInput.value,10) + 1));

  function collect(status){
    const selectedTags = Array.from(document.querySelectorAll('#tag-picker .tag-pick.selected')).map(b => b.dataset.tag);
    const isEdit = !!params.id;
    const existing = isEdit ? CMS.getPostById(params.id) : null;
    return {
      id: params.id || undefined,
      title: document.getElementById('f-title').value.trim() || 'Untitled',
      subtitle: document.getElementById('f-subtitle').value.trim(),
      content: document.getElementById('f-content').innerHTML,
      fontSize: parseInt(document.getElementById('f-font-size').value, 10) || 19,
      footer: document.getElementById('f-footer').innerHTML,
      slug: document.getElementById('f-slug').value.trim(),
      seoTitle: document.getElementById('f-seo-title').value.trim(),
      metaDescription: document.getElementById('f-meta-desc').value.trim(),
      coverImage: document.getElementById('f-cover').value,
      category: document.getElementById('f-category').value,
      tags: selectedTags,
      publishDate: document.getElementById('f-pubdate').value ? new Date(document.getElementById('f-pubdate').value).toISOString() : new Date().toISOString(),
      featured: document.getElementById('f-featured').checked,
      cardColor: document.getElementById('f-card-color-enabled').value === '1' ? document.getElementById('f-card-color').value : '',
      status: status,
      createdAt: existing ? existing.createdAt : undefined,
    };
  }

  document.getElementById('save-draft-btn').addEventListener('click', () => {
    const record = CMS.savePost(collect('draft'));
    toast('Draft saved.');
    location.hash = '/writings/edit/' + record.id;
    render();
    maybeSyncPush();
  });
  document.getElementById('publish-btn').addEventListener('click', () => {
    const data = collect('published');
    const future = new Date(data.publishDate) > new Date();
    const record = CMS.savePost(data);
    toast(future ? 'Writing scheduled.' : 'Writing published.');
    location.hash = '/writings/edit/' + record.id;
    render();
    maybeSyncPush();
  });
}

function wireMediaAdmin(){
  const dz = document.getElementById('media-dropzone');
  if (!dz) return;
  const fileInput = document.getElementById('media-file');
  dz.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { CMS.saveMedia({ name: file.name, dataUrl: reader.result }); toast('Image uploaded.'); render(); };
    reader.readAsDataURL(file);
  });
  document.getElementById('media-grid').addEventListener('click', e => {
    const del = e.target.closest('[data-delete]');
    const rep = e.target.closest('[data-replace]');
    if (del){
      confirmAction('Delete this image? Writings using it will keep a broken reference.', () => {
        CMS.deleteMedia(del.dataset.delete);
        toast('Image deleted.');
        render();
      });
    }
    if (rep){
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { CMS.saveMedia({ id: rep.dataset.replace, name: file.name, dataUrl: reader.result }); toast('Image replaced.'); render(); };
        reader.readAsDataURL(file);
      };
      input.click();
    }
  });
}

function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

  const total = CMS.getTotalViews();

  return `

  <p class="field-hint" style="margin-bottom:24px;max-width:64ch;">

    <div class="stat-card"><div class="stat-num">${total.toLocaleString()}</div><div class="stat-label">Total views logged</div></div>

    <div style="display:flex;align-items:flex-end;gap:6px;height:120px;">
      ${byDay.map(d => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;">
          <div title="${d.date}: ${d.count} views" style="width:100%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;height:${Math.max(3,(d.count/maxDay)*100)}%;"></div>
        </div>`).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-family:var(--sans);font-size:10.5px;color:var(--text-faint);">
      <span>${byDay[0].date.slice(5)}</span><span>${byDay[byDay.length-1].date.slice(5)}</span>

  <div class="admin-form-grid">
    <div class="admin-panel">
      <h3>Most-read writings</h3>
      ${top.length ? top.map(x => `
        <div class="activity-row">
          <span><a href="#/writings/edit/${x.post.id}" style="text-decoration:none;color:inherit;">${x.post.title}</a></span>
          <span>${x.views.toLocaleString()} views</span>
        </div>`).join('') : `<div class="admin-empty">No views recorded yet. Visit a writing on the live site to generate one.</div>`}
    </div>
    <div class="admin-panel">
      <h3>Where views come from</h3>
      ${referrers.length ? referrers.map(r => `
        <div style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-family:var(--sans);font-size:13px;margin-bottom:4px;"><span>${escapeHtml(r.ref)}</span><span>${r.count}</span></div>
          <div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${(r.count/maxRef)*100}%;background:var(--accent-2);"></div></div>
        </div>`).join('') : `<div class="admin-empty">No data yet.</div>`}
    </div>
  </div>

  <div class="admin-panel" style="padding:0;">
    <div class="table-wrap">
    <table class="admin-table">
      <thead><tr><th>Writing</th><th>Referrer</th><th>Device</th><th>When</th></tr></thead>

          const p = posts.find(pp => pp.slug === v.slug);

      <ol style="font-family:var(--sans); font-size:13.5px; color:var(--text-muted); padding-left:20px; margin-bottom:14px;">
        <li style="margin-bottom:8px;">Make sure your site's repo is <strong>public</strong> (required — visitors' browsers read the content file directly, with no login).</li>
        <li style="margin-bottom:8px;">Open <code>data.js</code> and fill in the <code>GITHUB_SYNC</code> constant near the top with your GitHub username and repo name.</li>
        <li style="margin-bottom:8px;">Commit and push — once redeployed, this panel will show token and sync controls.</li>
        <li>Generate a fine-grained GitHub token (Settings → Developer settings → Personal access tokens) scoped to just that repo with "Contents: Read and write" permission, then paste it here.</li>
      </ol>
    `}
  </div>

  <div class="admin-panel" style="max-width:600px;">
    <h3>Backup &amp; restore</h3>
    <p class="field-hint" style="margin-bottom:16px;">
      Your writings live in this browser's storage, scoped to whatever domain you're
      viewing the site from. If you edit content on more than one URL (e.g. a
      GitHub-hosted preview vs. your live Vercel deployment), nothing syncs between
      them automatically — use this to move content from one to the other.
    </p>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn ghost" id="export-backup-btn">Export all content</button>
      <button class="btn ghost" id="import-backup-btn">Import from backup file</button>
      <input type="file" id="import-backup-file" accept="application/json" style="display:none;">
    </div>
    <p class="field-hint" style="margin-top:12px;">
      Export downloads a single JSON file with every writing, category, tag, media item,
      and About page setting. Importing on another domain <strong>overwrites</strong>
      whatever's currently there on this browser — export a safety copy first if you're
      not sure.
    </p>
  </div>
  `;
}
function wireSettingsAdmin(){
  const chooseBtn = document.getElementById('choose-about-photo-btn');
  if (!chooseBtn) return;
  chooseBtn.addEventListener('click', () => {
    openImagePicker(dataUrl => {
      CMS.saveSettings({ aboutPhoto: dataUrl });
      toast('About photo updated.');
      render();
      maybeSyncPush();
    });
  });
  const removeBtn = document.getElementById('remove-about-photo-btn');
  if (removeBtn){
    removeBtn.addEventListener('click', () => {
      CMS.saveSettings({ aboutPhoto: '' });
      toast('About photo removed.');
      render();
      maybeSyncPush();
    });
  }

  wireEditor('f-about-content', document.querySelector('.editor-toolbar[data-for="f-about-content"]'));

  document.getElementById('save-about-btn').addEventListener('click', () => {
    const aboutValues = [0,1,2].map(i => ({
      title: document.getElementById(`f-about-value-title-${i}`).value.trim(),
      description: document.getElementById(`f-about-value-desc-${i}`).value.trim(),
    })).filter(v => v.title);
    CMS.saveSettings({
      aboutEyebrow: document.getElementById('f-about-eyebrow').value.trim(),
      aboutHeading: document.getElementById('f-about-heading').value.trim(),
      aboutLede: document.getElementById('f-about-lede').value.trim(),
      aboutContent: document.getElementById('f-about-content').innerHTML,
      aboutValues,
    });
    toast('About page saved.');
    render();
    maybeSyncPush();
  });

  document.getElementById('save-credentials-btn').addEventListener('click', () => {
    const newUser = document.getElementById('f-username').value.trim();
    const newPass = document.getElementById('f-new-password').value;
    if (!newUser){ toast('Username cannot be empty.'); return; }
    CMS.changeUsername(newUser);
    if (newPass) CMS.changePassword(newPass);
    toast('Credentials updated.');
    render();
  });

  document.getElementById('export-backup-btn').addEventListener('click', () => {
    const data = CMS.exportAll();
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `if-no-one-reads-this-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup downloaded.');
  });

  const importFileInput = document.getElementById('import-backup-file');
  document.getElementById('import-backup-btn').addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', () => {
    const file = importFileInput.files[0];
    if (!file) return;
    confirmAction(
      `Import "${file.name}"? This will overwrite all writings, categories, tags, media, and About page settings currently stored in this browser.`,
      () => {
        const reader = new FileReader();
        reader.onload = () => {
          let parsed;
          try { parsed = JSON.parse(reader.result); }
          catch (e) { toast('That file is not valid JSON.'); return; }
          const result = CMS.importAll(parsed);
          if (result.ok){
            toast('Backup imported. Reloading…');
            setTimeout(() => location.reload(), 900);
          } else {
            toast(result.reason || 'Import failed.');
          }
        };
        reader.readAsText(file);
      },
      { confirmLabel: 'Import & overwrite' }
    );
    importFileInput.value = '';
  });

  const saveTokenBtn = document.getElementById('save-token-btn');
  if (saveTokenBtn){
    saveTokenBtn.addEventListener('click', () => {
      const token = document.getElementById('f-github-token').value.trim();
      CMS.saveSyncConfig({ token });
      toast('Token saved to this browser.');
    });
  }
  const syncPullBtn = document.getElementById('sync-pull-btn');
  if (syncPullBtn){
    syncPullBtn.addEventListener('click', () => {
      syncPullBtn.disabled = true;
      toast('Pulling latest content from GitHub…');
      CMS.pullFromGitHubPublic().then(res => {
        syncPullBtn.disabled = false;
        toast(res.ok ? 'Pulled latest content.' : ('Pull failed: ' + res.reason));
        render();
      });
    });
  }
  const syncPushBtn = document.getElementById('sync-push-btn');
  if (syncPushBtn){
    syncPushBtn.addEventListener('click', () => {
      const tokenField = document.getElementById('f-github-token');
      if (tokenField){
        const typed = tokenField.value.trim();
        if (typed) CMS.saveSyncConfig({ token: typed });
      }
      syncPushBtn.disabled = true;
      toast('Pushing current content to GitHub…');
      CMS.pushToGitHub().then(res => {
        syncPushBtn.disabled = false;
        if (res.ok){
          toast('Pushed — other devices will see this on next load.');
        } else {
          const hint = /bad credentials/i.test(res.reason)
            ? ' — check that the token is current, unexpired, and has access to this exact repo.'
            : '';
          toast('Push failed: ' + res.reason + hint);
        }
        render();
      });
    });
  }
}

/* ===================================================================
   INTERACTIVITY: magnetic buttons + click ripple (dashboard buttons only —
   no custom cursor here, it would fight with the rich text editor's caret)
=================================================================== */
(function initAdminInteractivity(){
  const fine = window.matchMedia('(pointer: fine)').matches;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (fine && !reduced){
    function bindMagnetic(){
      document.querySelectorAll('.btn, .icon-btn').forEach(btn => {
        if (btn.dataset.magnetic) return;
        btn.dataset.magnetic = '1';
        btn.addEventListener('mousemove', e => {
          const r = btn.getBoundingClientRect();
          const x = e.clientX - r.left - r.width / 2;
          const y = e.clientY - r.top - r.height / 2;
          btn.style.transform = `translate(${x * 0.18}px, ${y * 0.18}px)`;
        });
        btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
      });
    }
    bindMagnetic();
    const observer = new MutationObserver(() => bindMagnetic());
    observer.observe(document.getElementById('app'), { childList: true, subtree: true });
  }
  document.addEventListener('click', e => {
    const btn = e.target.closest('.btn');
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - r.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - r.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
  });
})();

window.addEventListener('hashchange', render);
window.addEventListener('load', () => {
  render();
  if (CMS.isSyncTargetConfigured()){
    CMS.pullFromGitHubPublic().then(res => {
      if (!res.ok || !res.changed) return;
      const hash = location.hash.replace(/^#/, '');
      const isEditing = hash.indexOf('/writings/new') === 0 || hash.indexOf('/writings/edit') === 0;
      if (!isEditing) render(); // never redraw over an open editor — would wipe in-progress typing
    }).catch(() => {});
  }
});
render();
