name: Rebuild RSS feed

on:
  push:
    branches: [main]
    paths: [content.json, scripts/build-feed.js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-feed.js
      - name: Commit feed.xml if it changed
        run: |
          if [ -n "$(git status --porcelain feed.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.xml
            git commit -m "Rebuild feed.xml"
            git push
          fi
