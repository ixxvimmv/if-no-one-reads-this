name: Build site

# Regenerates everything that has to be a real file on a static host from content.json:
# compressed images, one page per writing (posts/<slug>/), the archive, feed.xml and sitemap.xml.
# See scripts/build-site.js.

on:
  push:
    branches: [main]
    paths: [content.json, scripts/build-site.js, package.json]
  schedule:
    - cron: "23 */6 * * *" # so a writing scheduled for a future date goes live without another edit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-site.js
      - name: Commit generated files
        run: |
          git add -A content.json images posts feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild static pages"
          git push || (git pull --rebase origin main && git push)
